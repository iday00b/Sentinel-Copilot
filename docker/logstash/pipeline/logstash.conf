input {
  http {
    host => "0.0.0.0"
    port => 5044
  }
}

filter {
  json {
    source => "[event][original]"
    target => "security_event"
  }

  date {
    match => ["[security_event][@timestamp]", "ISO8601"]
    target => "@timestamp"
  }

  ruby {
    code => '
      source = event.get("security_event") || {}
      normalized_fields = ["message", "event", "host", "observer", "source", "user", "related", "rule"]
      normalized_fields.each { |field| event.remove(field) }
      normalized_fields.each do |field|
        event.set(field, source[field]) if source.key?(field)
      end
      event.remove("security_event")
      event.remove("@version")
      event.remove("http")
      event.remove("url")
      event.remove("user_agent")
    '
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "sentinel-security-events-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
