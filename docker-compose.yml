name: sentinel-copilot

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Sentinel Copilot
      APP_ENV: development
      APP_VERSION: 0.1.0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      POSTGRES_DSN: postgresql://sentinel:change-this-development-password@postgres:5432/sentinel_copilot
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinel

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinel

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-development-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=1s > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sentinel

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.5
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    volumes:
      - ./docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro,Z
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sentinel

  security-event-template-setup:
    image: curlimages/curl:8.10.1
    volumes:
      - ./docker/elasticsearch/security-events-index-template.json:/templates/security-events-index-template.json:ro,Z
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        curl --fail --silent --show-error
        -X PUT
        -H 'Content-Type: application/json'
        --data-binary @/templates/security-events-index-template.json
        http://elasticsearch:9200/_index_template/sentinel-security-events
    restart: "no"
    networks:
      - sentinel

  alerts-template-setup:
    image: curlimages/curl:8.10.1
    volumes:
      - ./docker/elasticsearch/alerts-index-template.json:/templates/alerts-index-template.json:ro,Z
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        curl --fail --silent --show-error
        -X PUT
        -H 'Content-Type: application/json'
        --data-binary @/templates/alerts-index-template.json
        http://elasticsearch:9200/_index_template/sentinel-alerts
    restart: "no"
    networks:
      - sentinel

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.5
    environment:
      XPACK_MONITORING_ENABLED: "false"
    ports:
      - "${LOGSTASH_HTTP_PORT:-5044}:5044"
      - "${LOGSTASH_API_PORT:-9600}:9600"
    volumes:
      - logstash_data:/usr/share/logstash/data
      - ./docker/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro,Z
    depends_on:
      security-event-template-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/ > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sentinel

  detector:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      POSTGRES_DSN: postgresql://sentinel:change-this-development-password@postgres:5432/sentinel_copilot
      DETECTOR_POLL_INTERVAL_SECONDS: "10"
      DETECTOR_BATCH_SIZE: "100"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      alerts-template-setup:
        condition: service_completed_successfully
    networks:
      - sentinel

volumes:
  postgres_data:
  elasticsearch_data:
  logstash_data:

networks:
  sentinel:
    driver: bridge
